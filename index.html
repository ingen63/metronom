<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metronom">
<title>Metronom</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg-top: #000;
    --bg-bottom: #2b2b2b;
    --panel-line: #444;
    --blue: #4aa8dc;
    --blue-glow: rgba(74, 168, 220, .55);
    --text: #d8d8d8;
    --muted: #8a8a8a;
    --dim: #555;
    --pill: #1c1c1c;
    --pill-line: #333;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg-bottom);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; touch-action: manipulation; }
  .bpm, .field .val { touch-action: none; }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--blue); outline-offset: 2px; }

  /* ---------- Oberer Bereich ---------- */
  .top {
    position: relative;
    flex: 1 1 auto;
    min-height: 300px;
    background: var(--bg-top);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 24px 16px 48px;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    left: 50%; bottom: -60px;
    width: 420px; height: 160px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, var(--blue-glow) 0%, rgba(74,168,220,.15) 35%, transparent 70%);
    opacity: .35;
    pointer-events: none;
    transition: opacity .25s ease-out;
  }
  .glow.flash { transition: none; opacity: 1; }
  .glow.flash.accent { transform: translateX(-50%) scale(1.25); }

  .left { justify-self: end; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .pill {
    min-width: 56px;
    padding: 4px 10px;
    background: var(--pill);
    border: 1px solid var(--pill-line);
    border-radius: 3px;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
    text-align: center;
  }
  button.pill:hover { color: var(--text); }
  button.pill.active { color: var(--blue); border-color: #2c5a75; }

  .center { display: flex; flex-direction: column; align-items: center; }
  .chev { width: 64px; height: 28px; color: #666; display: grid; place-items: center; }
  .chev:hover { color: #aaa; }
  .chev svg { width: 56px; height: 18px; }
  .bpm {
    font-size: clamp(72px, 14vw, 120px);
    font-weight: 200;
    line-height: 1;
    color: var(--blue);
    font-variant-numeric: tabular-nums;
    min-width: 3ch;
    text-align: center;
    cursor: ns-resize;
  }

  .right { justify-self: start; display: flex; align-items: center; gap: 14px; }
  .sig {
    display: flex; flex-direction: column; align-items: center;
    font-size: 15px; line-height: 1.05; color: var(--muted);
    padding: 2px 4px;
  }
  .sig:hover { color: var(--text); }
  .subs { display: flex; align-items: flex-end; gap: 10px; }
  .sub { color: #777; height: 34px; display: flex; align-items: flex-end; }
  .sub:hover { color: #bbb; }
  .sub.active { color: var(--blue); }
  .sub svg { height: 30px; display: block; }

  .beats {
    position: absolute; left: 0; right: 0; bottom: 18px;
    display: flex; justify-content: center; gap: 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2a2a2a; transition: background .15s; }
  .dot.accent { width: 9px; height: 9px; margin-top: -1px; }
  .dot.on { background: var(--blue); box-shadow: 0 0 8px var(--blue-glow); transition: none; }

  /* ---------- Unterer Bereich ---------- */
  .bottom {
    flex: 0 0 auto;
    background: var(--bg-bottom);
    border-top: 1px solid var(--panel-line);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 28px 40px;
    padding: 24px 16px 28px;
  }
  .auto { display: flex; align-items: center; gap: 18px; }
  .auto-toggle {
    width: 54px; height: 34px;
    background: #1f1f1f;
    border: 1px solid #3a3a3a;
    border-radius: 3px;
    display: flex; align-items: flex-end; justify-content: center; gap: 2px;
    padding: 7px 0;
  }
  .auto-toggle i { display: block; width: 3px; background: #555; }
  .auto-toggle.on i { background: var(--blue); }
  .auto-fields { display: flex; gap: 18px; transition: opacity .2s; }
  .auto-fields.off { opacity: .35; }
  .field { display: flex; flex-direction: column; align-items: center; width: 52px; }
  .field .lbl, .field .unit { font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .field .val {
    font-size: 24px; font-weight: 300; color: var(--text);
    font-variant-numeric: tabular-nums; line-height: 1.1; cursor: ns-resize;
  }
  .field .step { color: #555; width: 32px; height: 14px; display: grid; place-items: center; }
  .field .step:hover { color: #aaa; }
  .field .step svg { width: 14px; height: 8px; }

  .play {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid #777;
    background: radial-gradient(circle at 50% 35%, #4a4a4a, #2a2a2a 70%);
    box-shadow: 0 2px 6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    display: grid; place-items: center;
    color: #9a9a9a;
  }
  .play:hover { color: #ccc; border-color: #999; }
  .play svg { width: 26px; height: 26px; }

  .volume { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .volume svg { width: 16px; height: 16px; flex: none; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 110px; height: 18px; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #111; border-radius: 2px; }
  input[type=range]::-moz-range-track { height: 4px; background: #111; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #ddd, #888);
    box-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #ddd, #888);
  }

  .hint { position: fixed; right: 12px; bottom: 8px; font-size: 10px; color: #555; letter-spacing: .04em; }

  /* iPhone: Notch / Home-Indikator freihalten */
  .top { padding-top: max(24px, env(safe-area-inset-top)); }
  .bottom { padding-bottom: max(28px, env(safe-area-inset-bottom)); }

  /* Touch-Geräte: größere Bedienflächen */
  @media (pointer: coarse) {
    .hint { display: none; }
    .pill { padding: 10px 16px; font-size: 13px; }
    .chev { width: 96px; height: 44px; }
    .sig { padding: 8px; font-size: 18px; }
    .sub { height: 44px; padding: 0 4px; }
    .field .step { width: 44px; height: 30px; }
    .field .step svg { width: 18px; height: 10px; }
    .field .val { font-size: 28px; }
    .play { width: 88px; height: 88px; }
    .play svg { width: 32px; height: 32px; }
    input[type=range] { width: 150px; height: 44px; }
    input[type=range]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -11px; }
  }

  @media (max-width: 640px) {
    .top { grid-template-columns: 1fr; justify-items: center; align-content: center; gap: 20px; padding-bottom: 56px; min-height: 0; }
    .left { justify-self: center; flex-direction: row; order: 2; }
    .right { justify-self: center; order: 3; }
    .bottom { gap: 22px; }
    .auto { flex-direction: column; gap: 10px; }
    .auto-fields { gap: 6px; }
    .field { width: 64px; }
    .hint { display: none; }
  }

  /* Querformat auf dem Handy: weniger Höhe */
  @media (max-height: 500px) and (orientation: landscape) {
    .top { min-height: 0; padding-top: 12px; padding-bottom: 36px; gap: 16px;
           padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    .bpm { font-size: 64px; }
    .chev { height: 32px; }
    .bottom { padding-top: 12px; gap: 16px 28px; }
    .auto { flex-direction: row; }
    .play { width: 64px; height: 64px; }
  }
</style>
</head>
<body>

<section class="top">
  <div class="left">
    <div class="pill" id="barPill" title="Aktueller Takt">TAKT 1</div>
    <button class="pill" id="tap" title="Tap-Tempo (Taste T)">TAP</button>
  </div>

  <div class="center">
    <button class="chev" id="up" aria-label="Tempo erhöhen">
      <svg viewBox="0 0 56 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 16 28 2 54 16"/></svg>
    </button>
    <div class="bpm" id="bpm" title="Scrollen oder ziehen zum Ändern">120</div>
    <button class="chev" id="down" aria-label="Tempo verringern">
      <svg viewBox="0 0 56 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2 28 16 54 2"/></svg>
    </button>
  </div>

  <div class="right">
    <button class="sig" id="sig" title="Taktart wechseln"><span id="sigTop">4</span><span id="sigBot">4</span></button>
    <div class="subs" id="subs">
      <!-- Viertel -->
      <button class="sub active" data-sub="1" title="Viertel">
        <svg viewBox="0 0 10 30" fill="currentColor"><ellipse cx="4.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 4.5 26)"/><rect x="7.6" y="2" width="1.3" height="24"/></svg>
      </button>
      <!-- Achtel -->
      <button class="sub" data-sub="2" title="Achtel">
        <svg viewBox="0 0 24 30" fill="currentColor"><ellipse cx="4.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 4.5 26)"/><ellipse cx="17.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 17.5 26)"/><rect x="7.6" y="2" width="1.3" height="24"/><rect x="20.6" y="2" width="1.3" height="24"/><rect x="7.6" y="2" width="14.3" height="3.2"/></svg>
      </button>
      <!-- Triolen -->
      <button class="sub" data-sub="3" title="Triolen">
        <svg viewBox="0 0 37 30" fill="currentColor"><ellipse cx="4.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 4.5 26)"/><ellipse cx="17.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 17.5 26)"/><ellipse cx="30.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 30.5 26)"/><rect x="7.6" y="6" width="1.3" height="20"/><rect x="20.6" y="6" width="1.3" height="20"/><rect x="33.6" y="6" width="1.3" height="20"/><rect x="7.6" y="6" width="27.3" height="3.2"/><text x="21.2" y="4.4" font-size="6" text-anchor="middle" font-family="Helvetica, Arial">3</text></svg>
      </button>
      <!-- Sechzehntel -->
      <button class="sub" data-sub="4" title="Sechzehntel">
        <svg viewBox="0 0 46 30" fill="currentColor"><ellipse cx="4.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 4.5 26)"/><ellipse cx="16.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 16.5 26)"/><ellipse cx="28.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 28.5 26)"/><ellipse cx="40.5" cy="26" rx="4.2" ry="3" transform="rotate(-20 40.5 26)"/><rect x="7.6" y="2" width="1.3" height="24"/><rect x="19.6" y="2" width="1.3" height="24"/><rect x="31.6" y="2" width="1.3" height="24"/><rect x="43.6" y="2" width="1.3" height="24"/><rect x="7.6" y="2" width="37.3" height="3"/><rect x="7.6" y="7.5" width="37.3" height="3"/></svg>
      </button>
    </div>
  </div>

  <div class="beats" id="beats"></div>
  <div class="glow" id="glow"></div>
</section>

<section class="bottom">
  <div class="auto">
    <button class="auto-toggle" id="autoToggle" title="Automatische Tempo-Steigerung ein/aus" aria-pressed="false">
      <i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:13px"></i><i style="height:16px"></i>
    </button>
    <div class="auto-fields off" id="autoFields">
      <div class="field" data-key="start"><span class="lbl">Start</span><button class="step" data-d="1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 7 7 1 13 7"/></svg></button><span class="val"></span><button class="step" data-d="-1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1 7 7 13 1"/></svg></button><span class="unit">BPM</span></div>
      <div class="field" data-key="end"><span class="lbl">Ziel</span><button class="step" data-d="1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 7 7 1 13 7"/></svg></button><span class="val"></span><button class="step" data-d="-1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1 7 7 13 1"/></svg></button><span class="unit">BPM</span></div>
      <div class="field" data-key="step"><span class="lbl">Plus</span><button class="step" data-d="1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 7 7 1 13 7"/></svg></button><span class="val"></span><button class="step" data-d="-1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1 7 7 13 1"/></svg></button><span class="unit">BPM</span></div>
      <div class="field" data-key="every"><span class="lbl">Alle</span><button class="step" data-d="1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 7 7 1 13 7"/></svg></button><span class="val"></span><button class="step" data-d="-1"><svg viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1 7 7 13 1"/></svg></button><span class="unit">Takte</span></div>
    </div>
  </div>

  <button class="play" id="play" aria-label="Start/Stop (Leertaste)">
    <svg id="playIcon" viewBox="0 0 26 26" fill="currentColor"><path d="M7 4 22 13 7 22Z"/></svg>
  </button>

  <div class="volume">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h3l4-3v10L5 10H2z"/></svg>
    <input type="range" id="vol" min="0" max="100" value="70" aria-label="Lautstärke">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor" stroke="none"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9"/></svg>
  </div>
</section>

<div class="hint">Leertaste: Start/Stop · T: Tap · ↑↓: Tempo</div>

<script>
(() => {
  const MIN_BPM = 20, MAX_BPM = 300;
  const SIGNATURES = [
    { top: 4, bot: 4, beats: 4, accents: [0] },
    { top: 3, bot: 4, beats: 3, accents: [0] },
    { top: 2, bot: 4, beats: 2, accents: [0] },
    { top: 6, bot: 8, beats: 6, accents: [0], secondary: [3] },
  ];
  const STEPS = [1, 2, 5, 10, 20];

  const state = {
    bpm: 120,
    sigIndex: 0,
    sub: 1,
    volume: 0.7,
    playing: false,
    auto: { on: false, start: 80, end: 140, stepIdx: 2, every: 4 },
  };

  const $ = id => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // ---------- Audio ----------
  let ctx = null, master = null;
  let nextTime = 0, beat = 0, subTick = 0, bar = 0, timerId = null;
  const LOOKAHEAD_MS = 25, SCHEDULE_AHEAD = 0.1;
  const drawQueue = [];

  // iPhone: Web Audio ist bei eingeschaltetem Stummschalter sonst lautlos.
  // Neuere iOS-Versionen kennen navigator.audioSession, ältere schalten über
  // ein stummes <audio>-Element in den Wiedergabe-Modus.
  let silentAudio = null;
  function silentWavUrl() {
    const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  function ensureAudio() {
    if (!ctx) {
      if (navigator.audioSession) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
      } else {
        silentAudio = new Audio(silentWavUrl());
        silentAudio.loop = true;
        silentAudio.setAttribute('playsinline', '');
      }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = state.volume;
      master.connect(ctx.destination);
    }
    if (silentAudio) silentAudio.play().catch(() => {});
    if (ctx.state !== 'running') ctx.resume();
  }

  // Bildschirm während des Spielens nicht abschalten
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release();
      }
    } catch (e) {}
  }

  // Nach Rückkehr aus dem Hintergrund Audio fortsetzen, ohne aufgestaute Klicks
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !state.playing) return;
    ensureAudio();
    keepAwake(true);
    nextTime = Math.max(nextTime, ctx.currentTime + 0.05);
    drawQueue.length = 0;
  });

  function click(time, level) {
    // level: 3 = Takt-Eins, 2 = Nebenakzent (6/8), 1 = Schlag, 0 = Unterteilung
    const freq = [700, 1000, 1250, 1600][level];
    const gain = [0.35, 0.7, 0.85, 1.0][level];
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = level >= 2 ? 'triangle' : 'sine';
    osc.frequency.value = freq;
    env.gain.setValueAtTime(0.0001, time);
    env.gain.exponentialRampToValueAtTime(gain, time + 0.001);
    env.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    osc.connect(env).connect(master);
    osc.start(time);
    osc.stop(time + 0.06);
  }

  function schedule() {
    const sig = SIGNATURES[state.sigIndex];
    while (nextTime < ctx.currentTime + SCHEDULE_AHEAD) {
      let level = 0;
      if (subTick === 0) {
        if (sig.accents.includes(beat)) level = 3;
        else if (sig.secondary && sig.secondary.includes(beat)) level = 2;
        else level = 1;
      }
      click(nextTime, level);
      drawQueue.push({ time: nextTime, beat, subTick, bar, level });

      nextTime += 60 / state.bpm / state.sub;
      if (++subTick >= state.sub) {
        subTick = 0;
        if (++beat >= sig.beats) {
          beat = 0;
          bar++;
          applyAutoIncrease();
        }
      }
    }
  }

  function applyAutoIncrease() {
    const a = state.auto;
    if (!a.on || bar % a.every !== 0) return;
    const step = STEPS[a.stepIdx];
    if (state.bpm === a.end) { if (a.start !== a.end) setBpm(a.start); return; }
    const next = a.end > state.bpm ? Math.min(a.end, state.bpm + step) : Math.max(a.end, state.bpm - step);
    setBpm(next);
  }

  function start() {
    ensureAudio();
    if (state.auto.on) setBpm(state.auto.start);
    beat = 0; subTick = 0; bar = 0;
    nextTime = ctx.currentTime + 0.06;
    state.playing = true;
    schedule();
    timerId = setInterval(schedule, LOOKAHEAD_MS);
    keepAwake(true);
    renderPlay();
  }

  function stop() {
    state.playing = false;
    clearInterval(timerId);
    keepAwake(false);
    if (silentAudio) silentAudio.pause();
    drawQueue.length = 0;
    clearDots();
    $('barPill').textContent = 'TAKT 1';
    renderPlay();
  }

  const toggle = () => (state.playing ? stop() : start());

  // ---------- Visuals ----------
  const glow = $('glow');
  function frame() {
    if (ctx) {
      while (drawQueue.length && drawQueue[0].time <= ctx.currentTime) {
        const n = drawQueue.shift();
        if (n.subTick === 0) {
          lightDot(n.beat);
          $('barPill').textContent = 'TAKT ' + (n.bar + 1);
          glow.classList.add('flash');
          glow.classList.toggle('accent', n.level === 3);
          requestAnimationFrame(() => requestAnimationFrame(() => glow.classList.remove('flash')));
        }
      }
    }
    requestAnimationFrame(frame);
  }

  function buildDots() {
    const sig = SIGNATURES[state.sigIndex];
    $('beats').innerHTML = '';
    for (let i = 0; i < sig.beats; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (sig.accents.includes(i) ? ' accent' : '');
      $('beats').appendChild(d);
    }
  }
  function clearDots() { document.querySelectorAll('.dot').forEach(d => d.classList.remove('on')); }
  function lightDot(i) {
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d, j) => d.classList.toggle('on', j === i));
  }

  function renderPlay() {
    $('playIcon').innerHTML = state.playing
      ? '<rect x="6" y="4" width="5" height="18" rx="1"/><rect x="15" y="4" width="5" height="18" rx="1"/>'
      : '<path d="M7 4 22 13 7 22Z"/>';
  }

  // ---------- Tempo ----------
  function setBpm(v) {
    state.bpm = clamp(Math.round(v), MIN_BPM, MAX_BPM);
    $('bpm').textContent = state.bpm;
  }

  function holdRepeat(el, fn) {
    let t1, t2;
    const stopHold = () => { clearTimeout(t1); clearInterval(t2); };
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      fn();
      t1 = setTimeout(() => { t2 = setInterval(fn, 60); }, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stopHold));
  }
  holdRepeat($('up'), () => setBpm(state.bpm + 1));
  holdRepeat($('down'), () => setBpm(state.bpm - 1));

  function dragWheel(el, fn) {
    el.addEventListener('wheel', e => { e.preventDefault(); fn(e.deltaY < 0 ? 1 : -1); }, { passive: false });
    let startY = null, acc = 0;
    el.addEventListener('pointerdown', e => { startY = e.clientY; acc = 0; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => {
      if (startY === null) return;
      acc += startY - e.clientY; startY = e.clientY;
      while (Math.abs(acc) >= 6) { fn(Math.sign(acc)); acc -= Math.sign(acc) * 6; }
    });
    el.addEventListener('pointerup', () => { startY = null; });
  }
  dragWheel($('bpm'), d => setBpm(state.bpm + d));

  // Tap-Tempo: Mittelwert der letzten Abstände, Reset nach 2 s Pause
  let taps = [];
  function tap() {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length > 5) taps.shift();
    if (taps.length >= 2) {
      const avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
      setBpm(60000 / avg);
    }
    const t = $('tap');
    t.classList.add('active');
    setTimeout(() => t.classList.remove('active'), 100);
  }
  $('tap').addEventListener('pointerdown', e => { e.preventDefault(); tap(); });

  // ---------- Taktart & Unterteilung ----------
  function renderSig() {
    const s = SIGNATURES[state.sigIndex];
    $('sigTop').textContent = s.top;
    $('sigBot').textContent = s.bot;
    buildDots();
  }
  $('sig').addEventListener('click', () => {
    state.sigIndex = (state.sigIndex + 1) % SIGNATURES.length;
    if (beat >= SIGNATURES[state.sigIndex].beats) { beat = 0; subTick = 0; }
    renderSig();
  });

  $('subs').addEventListener('click', e => {
    const b = e.target.closest('.sub');
    if (!b) return;
    state.sub = +b.dataset.sub;
    subTick = 0;
    document.querySelectorAll('.sub').forEach(x => x.classList.toggle('active', x === b));
  });

  // ---------- Lautstärke ----------
  $('vol').addEventListener('input', e => {
    state.volume = e.target.value / 100;
    if (master) master.gain.setTargetAtTime(state.volume, ctx.currentTime, 0.01);
  });

  // ---------- Automatische Steigerung ----------
  const fieldDefs = {
    start: { get: () => state.auto.start, set: v => state.auto.start = clamp(v, MIN_BPM, MAX_BPM), fmt: v => v },
    end:   { get: () => state.auto.end,   set: v => state.auto.end   = clamp(v, MIN_BPM, MAX_BPM), fmt: v => v },
    step:  { get: () => state.auto.stepIdx, set: v => state.auto.stepIdx = clamp(v, 0, STEPS.length - 1), fmt: i => '+' + STEPS[i] },
    every: { get: () => state.auto.every, set: v => state.auto.every = clamp(v, 1, 20), fmt: v => v },
  };
  function renderAuto() {
    document.querySelectorAll('.field').forEach(f => {
      const def = fieldDefs[f.dataset.key];
      f.querySelector('.val').textContent = def.fmt(def.get());
    });
    $('autoToggle').classList.toggle('on', state.auto.on);
    $('autoToggle').setAttribute('aria-pressed', state.auto.on);
    $('autoFields').classList.toggle('off', !state.auto.on);
  }
  document.querySelectorAll('.field').forEach(f => {
    const def = fieldDefs[f.dataset.key];
    const change = d => { def.set(def.get() + d); renderAuto(); };
    f.querySelectorAll('.step').forEach(b => holdRepeat(b, () => change(+b.dataset.d)));
    dragWheel(f.querySelector('.val'), change);
  });
  $('autoToggle').addEventListener('click', () => {
    state.auto.on = !state.auto.on;
    if (state.auto.on && !state.playing) setBpm(state.auto.start);
    renderAuto();
  });

  // ---------- Tastatur ----------
  $('play').addEventListener('click', toggle);
  document.addEventListener('keydown', e => {
    const onSlider = e.target.type === 'range';
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) toggle(); }
    else if (e.code === 'KeyT') { if (!e.repeat) tap(); }
    else if (e.code === 'ArrowUp' && !onSlider) { e.preventDefault(); setBpm(state.bpm + (e.shiftKey ? 10 : 1)); }
    else if (e.code === 'ArrowDown' && !onSlider) { e.preventDefault(); setBpm(state.bpm - (e.shiftKey ? 10 : 1)); }
  });
  // Buttons sollen die Leertaste nicht zusätzlich als Klick auslösen
  document.querySelectorAll('button').forEach(b => b.addEventListener('keydown', e => { if (e.code === 'Space') e.preventDefault(); }));

  setBpm(state.bpm);
  renderSig();
  renderAuto();
  renderPlay();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
